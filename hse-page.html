<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSE · 3RAG</title>
<link rel="icon" type="image/png" href="Favicon.png">
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700,800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f0f2f5;--bg2:#ffffff;--bg3:#f4f6f9;--bg4:#e2e8f0;--border:rgba(0,0,0,.09);--border2:rgba(0,0,0,.16);--text:#111827;--text2:#374151;--text3:#6b7280;--accent:#e1251b;--accent2:#c41f17;--green:#15803d;--amber:#b45309;--red:#dc2626;--blue:#2563eb;--purple:#7c3aed;--shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);--accent-soft:rgba(225,37,27,.08);--accent-border:rgba(225,37,27,.35);--font-body:'Satoshi',sans-serif;--font-mono:'DM Mono',monospace;--radius:10px;--radius-lg:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;background:var(--bg3);border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:var(--accent);padding:0}
textarea{resize:vertical;min-height:90px;line-height:1.5}
label.fl{display:block;font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 5px}
.mono{font-family:var(--font-mono)}
.tiny{font-size:11.5px;color:var(--text3)}
.muted{color:var(--text3)}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:230px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-logo{display:flex;align-items:center;gap:10px;padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.side-logo img{width:36px;height:36px;object-fit:contain;border-radius:8px}
.side-logo b{font-size:16px;font-weight:800;letter-spacing:.02em}
.side-logo span{display:block;font-size:11px;color:var(--text3)}
.side-sec{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:16px 16px 6px}
.nav{display:flex;align-items:center;gap:10px;width:calc(100% - 16px);margin:2px 8px;padding:9px 10px;border:none;background:none;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--text2);text-align:left}
.nav:hover{background:var(--bg3);color:var(--text)}
.nav.on{background:var(--accent-soft);color:var(--accent2);font-weight:700}
.ico{width:16px;height:16px;flex-shrink:0;vertical-align:-3px}
.nav .ic{display:flex}.nav .ic .ico{width:18px;height:18px}
.h-ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent2);flex-shrink:0}
.h-ic .ico{width:19px;height:19px}
.file>.ico{color:var(--text3)}
.nav .ct{margin-left:auto;font-size:11px;font-family:var(--font-mono);color:var(--text3)}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--text3);display:flex;flex-direction:column;gap:8px}
.side-foot a{color:var(--blue);text-decoration:none;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--text3);margin-right:6px}
.dot.on{background:var(--green)}
.main{flex:1;min-width:0;padding:22px 26px 60px}
.head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:21px;font-weight:800;display:flex;align-items:center;gap:10px}
.head p{font-size:12.5px;color:var(--text3);margin-top:3px}
.head .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* controls */
.btn{border:1px solid var(--border2);background:var(--bg2);color:var(--text);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600}
.btn:hover{background:var(--bg3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent2)}
.btn.danger{color:var(--red);border-color:rgba(220,38,38,.35)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.6;cursor:default}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--border2);margin-bottom:16px;align-items:center}
.tab{border:none;background:none;padding:10px 14px;font-size:13.5px;font-weight:600;color:var(--text3);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--accent2);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--border2);background:var(--bg2);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--text2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-border);color:var(--accent2)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;border-radius:99px;padding:3px 9px}
.badge.rule{background:rgba(220,38,38,.10);color:var(--red)}
.badge.policy{background:rgba(37,99,235,.10);color:var(--blue)}
.badge.ok{background:rgba(21,128,61,.12);color:var(--green)}
.badge.bad{background:rgba(220,38,38,.10);color:var(--red)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;font:inherit;color:inherit}
.card:hover{border-color:var(--accent-border)}
.card .date{font-size:11.5px;font-weight:700;color:var(--accent2);font-family:var(--font-mono)}
.card h3{font-size:15px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.card .snip{font-size:12.5px;color:var(--text2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta span{display:inline-flex;align-items:center;gap:5px}.card .meta .ico{width:14px;height:14px}
.card .meta{display:flex;gap:12px;font-size:11.5px;color:var(--text3);margin-top:auto;padding-top:6px}
.empty{background:var(--bg2);border:1px dashed var(--border2);border-radius:var(--radius-lg);padding:46px 20px;text-align:center;color:var(--text3)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

.pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px;scrollbar-width:thin}
.pill{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border2);background:var(--bg2);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text2);white-space:nowrap}
.pill:hover{color:var(--text)}
.pill .n{font-family:var(--font-mono);font-size:11px;background:var(--bg4);border-radius:99px;padding:1px 7px;color:var(--text2)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.on .n{background:rgba(255,255,255,.22);color:#fff}
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px;min-width:0}
.panel-h{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.panel-h h2{font-size:16px;font-weight:800}
.panel-h .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.hrow{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.hrow .card{flex:0 0 290px;scroll-snap-align:start;background:var(--bg3);box-shadow:none;min-height:190px}

/* table */
.tbl-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);padding:11px 14px;border-bottom:1px solid var(--border2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}

/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto;z-index:50}
.ov.on{display:flex}
.ov2{z-index:60;align-items:center}
.modal{background:var(--bg2);border-radius:var(--radius-lg);width:100%;max-width:680px;box-shadow:0 20px 50px rgba(15,23,42,.3)}
.modal-h{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 12px;border-bottom:1px solid var(--border)}
.modal-h h2{font-size:17px;font-weight:800;flex:1;overflow-wrap:anywhere}
.modal-h .x{border:none;background:none;font-size:22px;line-height:1;color:var(--text3);padding:0 4px}
.modal-b{padding:6px 20px 18px}
.modal-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px 18px;border-top:1px solid var(--border)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sect{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 8px}
.body-text{font-size:13.5px;line-height:1.65;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.file{display:flex;align-items:center;gap:10px;border:1px solid var(--border);background:var(--bg3);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file a{color:var(--blue);font-weight:600;text-decoration:none;font-size:12px}
.file .k{font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase}
.people{display:flex;flex-wrap:wrap;gap:6px}
.person{background:var(--bg3);border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:12px}
.pick{border:1px solid var(--border2);border-radius:10px;overflow:hidden}
.pick-top{display:flex;gap:8px;align-items:center;padding:8px;background:var(--bg3);border-bottom:1px solid var(--border)}
.pick-list{max-height:220px;overflow-y:auto}
.pick-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--border);cursor:pointer;font-size:13px}
.pick-row:last-child{border-bottom:none}
.pick-row:hover{background:var(--bg3)}
.pick-row .pl{margin-left:auto;font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.chk-sec{font-size:12px;font-weight:800;color:var(--accent2);margin:16px 0 6px}
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;cursor:pointer;font-size:13px;line-height:1.4}
.chk:hover{background:var(--bg3)}
.chk.view{cursor:default}
.chk .mk{display:flex;flex-shrink:0;padding-top:1px}
  .q{display:grid;grid-template-columns:26px 1fr auto;gap:6px 10px;align-items:start;padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:5px;font-size:13px;line-height:1.4}
.q.miss{border-color:var(--red);background:rgba(220,38,38,.05)}
.q .qn{font-family:var(--font-mono);font-size:11.5px;color:var(--text3);padding-top:1px}
.q .yn{display:flex;gap:12px;white-space:nowrap}
.q .yn label,.verdict label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-weight:600}
.q input[type=radio],.verdict input{width:16px;height:16px;accent-color:var(--accent);padding:0}
.q .qr{grid-column:2/4;padding:6px 9px;font-size:12.5px}
.q .qrem{display:block;font-size:12px;color:var(--text2);margin-top:3px}
.q .ans{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12.5px}
.q .ans.yes{color:var(--green)}.q .ans.no{color:var(--red)}
.verdict{display:flex;gap:22px;padding:10px 12px;border:1px solid var(--border2);border-radius:8px;font-size:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;min-width:0}
.kv span{display:block;font-size:10.5px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em}
.kv b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.modal.wide{max-width:900px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border:1px solid var(--border2);background:var(--bg2);border-radius:8px;color:var(--text2)}
.icon-btn:hover{background:var(--bg3);color:var(--accent2)}
.icon-btn .ico{width:17px;height:17px}
.hdr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.combo{position:relative}
.combo-list{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;box-shadow:0 12px 28px rgba(15,23,42,.18);max-height:230px;overflow-y:auto;z-index:5;min-width:210px}
.combo-list.on{display:block}
.combo-opt{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;text-align:left;padding:8px 10px;font-size:13px;color:var(--text);border-bottom:1px solid var(--border)}
.combo-opt:last-child{border-bottom:none}
.combo-opt:hover{background:var(--accent-soft)}
.combo-opt small{margin-left:auto;font-size:11px;color:var(--text3);white-space:nowrap}
.combo-none{padding:10px;font-size:12px;color:var(--text3)}
/* the paper form */
.paper-wrap{background:var(--bg4);padding:16px;overflow-x:auto}
.paper{background:#fff;color:#000;font-family:Calibri,Arial,Helvetica,sans-serif;font-size:12.5px;line-height:1.35;padding:0 30px 26px;min-width:640px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.p-head{margin:0 -30px 14px;overflow:hidden;aspect-ratio:1414/276}
.p-head img{display:block;width:100%}
.p-box{border:1px solid #000;min-height:48px;padding:6px 8px;white-space:pre-wrap}
.p-tbl td.k{font-weight:700;background:#f1f1f1;width:19%}
#printHost{position:absolute;left:-10000px;top:0;width:794px}
.p-logo{display:block;height:58px;margin:0 auto 6px}
.p-title{text-align:center;font-size:17px;font-weight:700;margin:4px 0 14px;text-decoration:underline}
.p-line{margin:7px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 6px}
.p-fill{display:inline-block;border-bottom:1px dotted #000;padding:0 6px;font-weight:600}
.p-note{font-style:italic;margin:8px 0 2px}
.p-sub{font-weight:700;margin:12px 0 5px}
.p-tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.p-tbl.joined{margin-top:0}.p-tbl.joined thead th{border-top:none}
.p-tbl th,.p-tbl td{border:1px solid #000;padding:4px 6px;color:#000;vertical-align:top;text-transform:none;letter-spacing:0;font-size:12px;white-space:normal}
.p-tbl th{background:#e6e6e6;font-weight:700;text-align:center}
.p-tbl td.c{text-align:center}.p-tbl td.mk{font-weight:700;font-size:14px;vertical-align:middle}
.p-tbl tr{break-inside:avoid;page-break-inside:avoid}
.p-sec td{font-weight:700;background:#f1f1f1}
.p-tick{display:flex;align-items:center;gap:26px;margin:16px 0 12px;font-weight:700}
.p-tick span{display:inline-flex;align-items:center;gap:8px}
.p-box{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid #000;font-size:15px}
.p-defects{border:1px solid #000;min-height:64px;padding:6px 8px;white-space:pre-wrap}
@media print{
  @page{size:A4;margin:6mm 0 10mm}
  body.ph .ov{display:none!important}
  body.ph #printHost{position:static;width:auto}
  body{background:#fff}
  .app,.toast,.gate,.modal-h,.modal-f,.no-print,#ov2{display:none!important}
  .ov{position:static;display:block;padding:0;background:none;overflow:visible}
  .modal,.modal.wide{max-width:none;box-shadow:none;border-radius:0}
  .paper-wrap{padding:0;background:none;overflow:visible}
  .paper{box-shadow:none;min-width:0}
}
.err{background:rgba(220,38,38,.08);color:var(--red);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:12px;display:none}
.err.on{display:block}
.banner{background:rgba(180,83,9,.10);color:var(--amber);border:1px solid rgba(180,83,9,.25);border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:16px}

/* sign-in */
.gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px;z-index:80}
.gate.on{display:flex}
.gate-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:28px;width:100%;max-width:360px}
.gate-box h1{font-size:20px;font-weight:800;margin-bottom:4px}
.gate-err{background:var(--red);color:#fff;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-top:12px;display:none}
.gate-err.on{display:block}
.gate-err a{color:#fff;font-weight:700;display:block;margin-top:6px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw}
.toast.on{opacity:1}

@media(max-width:800px){
  .app{flex-direction:column}
  .side{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border)}
  .side-sec{display:none}
  .side-nav{display:flex;overflow-x:auto;padding:6px 8px}
  .nav{width:auto;white-space:nowrap;margin:2px}
  .nav .ct{margin-left:6px}
  .side-foot{flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px}
  .main{padding:16px 16px 60px}
}
@media(max-width:520px){.row2{grid-template-columns:1fr}}

/* ===== Nov 2026 restyle: FleetGuard colours, bolder cards and windows ===== */
.side-logo>div{flex:1;text-align:center}
.side-logo b{display:block;font-size:26px;font-weight:900;letter-spacing:.08em;line-height:1.1}
.side-logo span{margin-top:2px}
.side-logo img{background:#fff}
.side-foot{gap:6px}
.sf-row{display:flex;align-items:center;gap:8px;min-width:0}
.sf-row #liveTxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-row #acct{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf-ver{font-size:11px;font-weight:400;color:var(--text3);white-space:nowrap}
.sf-sep{color:var(--text3)}
.sf-row #liveTxt{flex:0 1 auto}
.sf-row .dot{flex-shrink:0;margin-right:0}
.side-logo span.ver{display:inline-block;margin-top:6px;padding:2px 9px;border-radius:99px;background:var(--accent-soft);border:1px solid var(--accent-border);color:var(--accent2);font-size:10.5px;font-weight:800;letter-spacing:.05em}
.nav.on{color:var(--text);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.nav.on .ic{color:var(--accent2)}
.side-foot a{color:var(--text2)}.side-foot a:hover{color:var(--accent2)}
.head h1{font-weight:900;letter-spacing:-.01em}
.btn{background:var(--bg3)}.btn:hover{background:var(--bg4)}
.btn{background:var(--bg2)}.btn:hover{background:var(--bg3)}.btn.pri{background:var(--accent);font-weight:700}.btn.pri:hover{background:#c41f17;border-color:#c41f17}
.btn.danger{border-color:rgba(240,76,90,.4)}
.badge.rule,.badge.bad{background:rgba(220,38,38,.10)}
.badge.policy{background:rgba(37,99,235,.10)}

/* upload to the same Google Drive folder FleetGuard uses (Apps Script; busy answers are tried again) */
async function driveUpload(file,folder){
  if(file.size>15*1024*1024)throw new Error(`"${file.name}" is over 15 MB — use a smaller file`);
  const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(new Error('could not read the file'));r.readAsDataURL(file)});
  const clean=String(file.name||'file').replace(/[^A-Za-z0-9_.-]+/g,'_').slice(-120);
  const body=JSON.stringify({base64:b64,fileName:Date.now().toString(36)+'_'+clean,mimeType:file.type||'application/octet-stream',folder});
  let res=null,last='';
  for(const w of [0,3000,8000]){
    if(w)await new Promise(r=>setTimeout(r,w));
    try{res=await fetch(DRIVE_UPLOAD_URL,{method:'POST',mode:'cors',redirect:'follow',headers:{'Content-Type':'text/plain'},body})}catch(e){res=null;last='the Google Drive upload service did not answer';continue}
    if(res.ok)break;last='the Google Drive upload service answered '+res.status;if(![404,408,429,500,502,503,504].includes(res.status))break;
  }
  if(!res||!res.ok)throw new Error(last||'upload failed');
  let j;try{j=await res.json()}catch(e){throw new Error('the upload service sent back something unreadable')}
  if(Array.isArray(j))j=j[0]||{};
  if(!j||j.success===false||!j.url)throw new Error((j&&j.error)||'no Google Drive link came back');
  return j.url;
}

/* Nov 2026: the HSE page has its own tick in FleetGuard → Settings → Users (pages.hse). FleetGuard access alone no longer
   opens it; an Admin always can, so the administrator is never locked out. Same rule as userPages() in js/app.js and as
   the database rules. Signing in is also this page's own: a session carried over from FleetGuard or the Orders page in
   the same tab is not accepted — the person signs in here. */
function mayOpen(r){
  if(!r||typeof r!=='object'||r.active===false)return false;
  if(r.role==='Admin')return true;
  return !!(r.pages&&typeof r.pages==='object'&&r.pages.hse===true);

const hseSignedHere=v=>{try{if(v===undefined)return sessionStorage.getItem('hse_signed_here')==='1';v?sessionStorage.setItem('hse_signed_here','1'):sessionStorage.removeItem('hse_signed_here')}catch(e){return v===undefined?true:undefined}};
function gateErr(msg){const e=$('gateErr');e.textContent=msg;e.classList.toggle('on',!!msg);$('si_btn').textContent='Sign in';$('si_btn').disabled=false}
function deny(msg){hseSignedHere(false);firebase.auth().signOut().catch(()=>{});setTimeout(()=>gateErr(msg),80)}
function connect(){
  if(typeof firebase==='undefined'){FB.state='offline';$('gate').classList.add('on');gateErr('Could not reach the sign-in service — check the internet connection and reload.');render();return}
  if(!firebase.apps.length)firebase.initializeApp(FB_CFG);
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{
    if(u&&!hseSignedHere()){FB.user=null;firebase.auth().signOut().catch(()=>{});return}   /* came in with another page's session — sign in here first */
    FB.user=u;
    if(!u){hseSignedHere(false);FB.state='signedout';$('gate').classList.add('on');render();return}
    if(FB.state!=='live'){FB.state='connecting';FB.loaderGaveUp=false;clearTimeout(FB.loaderT);FB.loaderT=setTimeout(()=>{if(FB.state==='connecting'){FB.loaderGaveUp=true;render()}},20000);render()}
    const ref=firebase.database().ref('users/'+u.uid);
    ref.once('value').then(s=>{
      const rec=s.val();
      if(!rec){   /* an account nobody added: register it with no access so it shows in FleetGuard → Settings → Users */
        ref.set({email:u.email||'',role:'Driver',pages:{orders:false,fleetguard:false,hse:false},pagesSetAt:Date.now(),pagesSetBy:'first sign-in (no access yet)',active:true,firstSeen:Date.now(),via:'HSE page'}).catch(()=>{});
        deny('Your account is registered. Ask the administrator to give it access in FleetGuard → Settings → Users, then sign in again.');return}
      if(rec.active===false){deny('This account has been turned off. Ask the administrator.');return}
      if(!mayOpen(rec)){deny('This account has no access to the HSE page. Ask the administrator to tick HSE for it in FleetGuard → Settings → Users.');return}
      $('gate').classList.remove('on');gateErr('');listen();render();
    }).catch(()=>deny('Could not check this account\'s access — check the internet connection and try again.'));
  });
}

}

/* ---------- transfer from FleetGuard's earlier HSE Policy page ----------
   Every field of the old record is carried across as it is (…o) and the fields this page uses are added on top, so nothing
   is lost: category, severity, rank, enforcement measure, linked violation types, acknowledgements, version history,
   action items, staff attendees and every attachment. The old records are only read, never changed or removed.
   fleetguard/hse/transferred/<key> remembers what was copied, so a record is never copied twice — also not after it
   is deleted here. hseLegacyKey() in js/app.js builds the same key; keep the two in step. */
const legKey=(p,r)=>'fg_'+p+'_'+String(r.id||r.title||'').replace(/[^A-Za-z0-9_-]+/g,'_').slice(0,60);
function legacyPending(){return {pol:LEG.policies.filter(r=>r&&!S.transferred[legKey('pol',r)]),mtg:LEG.meetings.filter(r=>r&&!S.transferred[legKey('mtg',r)])}}
const stamp=v=>{const n=typeof v==='number'?v:Date.parse(v);return n>0?n:Date.now()};
function mapPolicy(o){
  const files=[],u=o.pdfUrl||o.pdfStorageUrl||o.pdfFileData||'';
  if(u||o.pdfFileName)files.push({name:o.pdfFileName||'Signed policy.pdf',kind:'Signed PDF',url:u,driveId:o.pdfDriveId||''});
  return {...o,id:legKey('pol',o),legacyId:o.id||'',source:'FleetGuard HSE Policy page',type:'Policy',title:o.title||'Untitled policy',details:o.description||'',files,
    createdAt:stamp(o.createdAt),createdAtOriginal:o.createdAt||'',createdBy:o.createdBy||'',transferredAt:Date.now(),transferredBy:who()};
}
function mapMeeting(o){
  const low=x=>String(x||'').trim().toLowerCase();
  const attendees=asArr(o.attendees).map(a=>{
    const d=a.type==='staff'?null:(FB.drivers.find(x=>a.name&&low(x.name)===low(a.name))||FB.drivers.find(x=>a.id&&low(x.id)===low(a.id)));
    const out={id:a.id||'',name:a.name||(d&&d.name)||'',type:a.type==='staff'?'staff':'driver'};if(d)out.idx=d._idx;return out});
  let files=asArr(o.attachments).map(a=>({...a,name:a.name||'Attachment',kind:'',url:a.url||'',at:a.uploadedAt||''}));
  if(!files.length&&(o.pdfUrl||o.pdfFileName))files=[{name:o.pdfFileName||'Meeting report.pdf',kind:'',url:o.pdfUrl||''}];
  return {...o,id:legKey('mtg',o),legacyId:o.id||'',source:'FleetGuard HSE Policy page',date:o.date||'',topic:o.title||'Untitled meeting',summary:o.summary||'',attendees,files,
    createdAt:stamp(o.createdAt),createdAtOriginal:o.createdAt||'',createdBy:o.createdBy||'',transferredAt:Date.now(),transferredBy:who()};
}
function transferBanner(){

  return `<div class="banner" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span><b>${n} record${n===1?'':'s'} from FleetGuard's HSE Policy page ${n===1?'is':'are'} not here yet</b> — ${p.pol.length} polic${p.pol.length===1?'y':'ies'} and ${p.mtg.length} meeting${p.mtg.length===1?'':'s'}. Transferring copies everything across; nothing is removed from FleetGuard.</span><button class="btn pri sm" style="margin-left:auto" onclick="H.transfer()">Transfer now</button></div>`;

async function transferLegacy(){
  const p=legacyPending(),n=p.pol.length+p.mtg.length;if(!n)return;
  if(!await ask(`Transfer ${p.pol.length} polic${p.pol.length===1?'y':'ies'} to Rules & Policy and ${p.mtg.length} meeting${p.mtg.length===1?'':'s'} to Toolbox Meeting? Nothing is removed from FleetGuard.`,'Transfer'))return;
  let done=0;const failed=[];
  for(const [col,pre,rows,map] of [['policies','pol',p.pol,mapPolicy],['toolbox','mtg',p.mtg,mapMeeting]]){
    for(const o of rows){
      const key=legKey(pre,o);
      try{await put(col,map(o));await put('transferred',{id:key,from:o.id||'',at:Date.now(),by:who()});done++}
      catch(e){failed.push((o.title||o.id||'record')+': '+(e&&e.message||e))}
    }
  }
  render();toast(failed.length?`${done} transferred, ${failed.length} failed — ${failed[0]}`:`${done} record${done===1?'':'s'} transferred`);
}

const FLT={incidents:{q:'',period:'all',from:'',to:'',status:'all',severity:'all'},toolbox:{q:'',period:'all',from:'',to:''},vehicles:{q:'',period:'all',from:'',to:'',result:'all'},jmps:{q:'',period:'all',from:'',to:''}};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function inPeriod(date,f){
  if(f.period==='all')return true;const d=String(date||'').slice(0,10),t=today();if(!d)return false;

  return (!f.from||d>=f.from)&&(!f.to||d<=f.to);

const fText=(f,...parts)=>{const q=f.q.trim().toLowerCase(),h=parts.join(' ').toLowerCase(),ns=x=>x.replace(/\s+/g,'');return !q||h.includes(q)||ns(h).includes(ns(q))};   /* "rad801" finds "RAD 801 E" */

/* ---------- incidents & accidents ----------
   The register is FleetGuard's own and stays where FleetGuard keeps it, so the driver card, the dashboard and the reports
   go on working unchanged: a record with a driver lives in fleetguard/drivers/<n>/accidentsList, a record without one in
   fleetguard/incidents. This page is now the only place that adds, edits or deletes them; FleetGuard only shows them.
   Every write is a transaction on that one driver (checked by _idx) or on the incidents list, so nothing else on the
   driver is touched. A deleted record goes to FleetGuard's Recycle Bin, where it can be restored. */
const INC_STATUS=['Open','Under investigation','Closed'],INC_SEV=['Minor','Major','Fatal'];
const incSig=r=>r.id||JSON.stringify([r.date,r.description,r.createdAt]);

  return {type:String(r.recordType||r.type||'accident').toLowerCase()==='incident'?'incident':'accident',status:INC_STATUS.includes(r.status)?r.status:'Open',severity:INC_SEV.includes(r.severity)?r.severity:'Minor',
    cost:Number(r.costEstimate!==undefined&&r.costEstimate!==null&&r.costEstimate!==''?r.costEstimate:(r.cost||0))||0,plate:r.truckPlate||(d&&d.license_plate)||'',driver:d?d.name:(r.driverName||'')};
}
function incAll(){
  const out=[];
  FB.drivers.forEach(d=>asArr(d.accidentsList).forEach(a=>out.push({rec:a,src:'driver',didx:d._idx,driver:d})));
  FB.incidents.forEach(a=>out.push({rec:a,src:'incident',didx:-1,driver:null}));
  return out.map((x,n)=>({...x,v:incView(x.rec,x.driver),key:String(n)}));
}

/* change one list of records: fn gets the current list and returns the new one (or throws to cancel) */
async function incTx(src,didx,fn){
  const clean=l=>JSON.parse(JSON.stringify(l));
  if(DEMO){
    if(src==='driver'){const d=FB.drivers.find(x=>x._idx===didx);if(!d)throw new Error('driver not found');d.accidentsList=clean(fn(asArr(d.accidentsList).slice()))}
    else FB.incidents=clean(fn(FB.incidents.slice()));
    demoIncSave();return;
  }
  const db=firebase.database();let why='';
  const run=src==='driver'
    ?(async()=>{const k=FB.dkey[didx];if(k==null)throw new Error('this driver is no longer in FleetGuard');
        if((await db.ref('fleetguard/drivers/'+k+'/_idx').once('value')).val()!==didx)throw new Error('the driver list changed — reload the page and try again');
        return db.ref('fleetguard/drivers/'+k+'/accidentsList').transaction(cur=>{try{return clean(fn(asArr(cur)))}catch(e){why=e.message;return}})})()
    :db.ref('fleetguard/incidents').transaction(cur=>{try{return clean(fn(asArr(cur)))}catch(e){why=e.message;return}});
  const res=await run;if(!res.committed)throw new Error(why||'the record could not be saved');
}
async function incNextId(year){
  let max=0;const scan=r=>{const m=/^INC-(\d{4})-(\d+)$/.exec(String((r&&r.id)||''));if(m&&+m[1]===year)max=Math.max(max,+m[2])};
  incAll().forEach(x=>scan(x.rec));
  if(!DEMO){try{asArr((await firebase.database().ref('fleetguard/recycleBin').once('value')).val()).forEach(b=>{if(b.type==='accident'||b.type==='incident')scan(b.data)})}catch(e){}}
  return `INC-${year}-${String(max+1).padStart(4,'0')}`;
}

    const prev=old?incBySig(old.sig):null;if(old&&!prev)throw new Error('this record was changed or removed by someone else — reopen it');

    else{rec={...fields,files,createdAt:now,createdBy:who()};if(status==='Closed')rec.closedAt=today()}
    if(!rec.id)rec.id=await incNextId(+rec.date.slice(0,4)||new Date().getFullYear());
    if(!d)rec.driverName='';else delete rec.driverName;
    const src=d?'driver':'incident',didx=d?d._idx:-1;
    if(prev&&prev.src===src&&prev.didx===didx)await incTx(src,didx,incReplaceIn(old.sig,rec));
    else{await incTx(src,didx,l=>{l.push(rec);return l});if(prev)await incTx(prev.src,prev.didx,incReplaceIn(old.sig,null))}   /* the driver changed: the record moves with them */
    UI.incTab=rec.recordType;closeModal();toast(`${rec.recordType==='incident'?'Incident':'Accident'} ${rec.id} saved`);
  }catch(e){fail('Not saved: '+(e&&e.message||e))}
}

/* A small picture of the file on the left: the image itself, Google Drive's own preview of the file when it is on Drive,
   and otherwise a tile with the file type. If the preview cannot be loaded the tile stays. */
function driveId(f){if(f.driveId)return String(f.driveId);const m=/\/d\/([A-Za-z0-9_-]{10,})|[?&]id=([A-Za-z0-9_-]{10,})/.exec(String(f.url||''));return m?(m[1]||m[2]):''}
function thumbHtml(f){
  const u=String(f.url||''),ext=(/\.([A-Za-z0-9]{2,5})$/.exec(String(f.name||''))||['',''])[1].toLowerCase();
  const isImg=/^(jpe?g|png|gif|webp|bmp)$/.test(ext)||/^image/.test(String(f.mimeType||f.type||''))||/^data:image\//.test(u);
  const cls=ext==='pdf'||f.type==='pdf'?'pdf':isImg?'img':/^docx?$/.test(ext)?'doc':/^(xlsx?|csv)$/.test(ext)?'xls':'';
  const id=driveId(f),src=/^data:image\//.test(String(f.thumb||''))?f.thumb:/^(data:image\/|blob:)/.test(u)?u:id?`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w160`:(isImg&&safeUrl(u))||'';
  return `<span class="thumb ${cls}">${esc((ext||(cls==='pdf'?'pdf':'file')).toUpperCase().slice(0,4))}${src?`<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</span>`;
}
function filesHtml(files){
  files=asArr(files);if(!files.length)return '<p class="tiny">No attachments.</p>';
  return files.map(f=>{const u=safeUrl(f.url),inl=/^data:(application\/pdf|image\/)/i.test(String(f.url||''))?String(f.url):'';
    return `<div class="file">${thumbHtml(f)}<span class="nm">${esc(f.name)}<small>${esc(f.kind||(u||inl?'Attachment':f.uploadFailed?'Upload failed — attach again':'Not uploaded'))}</small></span>${u?`<a class="ib" href="${esc(u)}" target="_blank" rel="noopener" title="Open the file" aria-label="Open ${esc(f.name)}">${ico('eye')}</a>`:inl?`<button class="ib" data-u="${esc(inl)}" onclick="H.openInline(this)" title="Open the file" aria-label="Open ${esc(f.name)}">${ico('eye')}</button>`:`<button class="ib" onclick="H.noFile()" title="This file was not uploaded" aria-label="Open ${esc(f.name)}">${ico('eye')}</button>`}</div>`}).join('');
}
function peopleHtml(att){att=asArr(att);return att.length?`<div class="people">${att.map(a=>`<span class="person">${esc(a.name)}${a.type==='staff'?' <span class="tiny">staff</span>':''}</span>`).join('')}</div>`:'<p class="tiny">No drivers ticked.</p>'}
function pickerHtml(){

  if(!ds.length)return '<p class="tiny">No drivers loaded from FleetGuard yet.</p>';

    <div class="tiny" id="pickCount" style="margin-top:6px"></div>`;
}
function pickedDrivers(){
  const ids=[...document.querySelectorAll('#pickList input:checked')].map(i=>i.value);
  return ids.map(v=>{const d=FB.drivers.find(x=>String(x._idx)===v);return d?{idx:d._idx,id:d.id||'',name:d.name||''}:null}).filter(Boolean);
}
function keptFilesHtml(){return FORM.files.map((f,i)=>`<div class="file">${thumbHtml(f)}<span class="nm">${esc(f.name)}<small>${esc(f.kind||'Attachment')}</small></span><button type="button" class="ib del" title="Remove this file" aria-label="Remove ${esc(f.name)}" onclick="H.dropFile(${i})">${ico('trash')}</button></div>`).join('')}
/* Attachments in a form: "Add files" can be used again and again, each time with one file or several; every chosen file
   is listed with its picture before saving and can be taken off again. A small picture of each image is kept in the
   record, so it shows when the record is opened even where Google Drive does not hand out a preview. */
const FILE_ACCEPT='image/*,application/pdf,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx';
function fileInput(id,label,accept){return `<label class="fl">${label}</label><div class="addfiles"><button type="button" class="btn sm" onclick="document.getElementById('${id}').click()">${ico('clip')} Add files</button><span class="tiny">One or several at a time — add more as often as you need.</span><input type="file" id="${id}" multiple hidden accept="${accept||FILE_ACCEPT}" onchange="H.addFiles('${id}',this)"></div><div id="pend_${id}"></div>`}
const pendList=id=>(FORM&&FORM.pending&&FORM.pending[id])||[];
const sizeTxt=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function pendHtml(id){return pendList(id).map((p,i)=>`<div class="file">${thumbHtml({name:p.file.name,url:p.url,mimeType:p.file.type})}<span class="nm">${esc(p.file.name)}<small>New · ${sizeTxt(p.file.size)}</small></span><button type="button" class="ib del" title="Take this file off" aria-label="Remove ${esc(p.file.name)}" onclick="H.dropPending('${id}',${i})">${ico('trash')}</button></div>`).join('')}
function makeThumb(file){
  if(!/^image\//.test(file.type||''))return Promise.resolve('');
  return new Promise(res=>{const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{try{const k=Math.min(1,140/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))}catch(e){res('')}URL.revokeObjectURL(u)};
    im.onerror=()=>{URL.revokeObjectURL(u);res('')};im.src=u});
}
async function gatherFiles(slots,folder){
  const out=FORM.files.slice();
  for(const [id,kind] of slots){
    for(const p of pendList(id)){
      const url=DEMO?'':await driveUpload(p.file,folder),thumb=await makeThumb(p.file);
      out.push({name:p.file.name,kind,url,at:Date.now(),mimeType:p.file.type||'',size:p.file.size||0,...(thumb?{thumb}:{})});
    }
  }
  return out;
}

  const items=[...document.querySelectorAll('#modal .q')].map(q=>{const c=q.querySelector('input[type=radio]:checked');return {el:q,sec:q.dataset.sec,no:q.dataset.no,label:q.dataset.label,ans:c?c.value:'',remark:q.querySelector('.qr').value.trim()}});
  const miss=items.filter(i=>!i.ans);
  if(miss.length){miss.forEach(i=>i.el.classList.add('miss'));miss[0].el.scrollIntoView({block:'center'});return fail(`${miss.length} item${miss.length===1?' is':'s are'} not marked Yes or No (shown in red).`)}
  const rec={id:newId(kind==='safeToLoad'?'sl':'vi'),kind,plate:val('plate'),date:val('date'),items:items.map(({el,...i})=>i),checkedBy:who(),createdAt:Date.now()};
  v.top.concat(v.bottom||[]).forEach(f=>{rec[f[0]]=val(f[0])});
  if(v.defects)rec.defects=val('defects');
  if(v.sign)rec.sign=v.sign.map(f=>({role:f[1],name:val(f[0]),date:val(f[0]+'_d')}));
  if(v.verdict){const c=document.querySelector('input[name=v_verdict]:checked');if(!c)return fail('Tick one: OK to load or Rejected.');rec.verdict=c.value}
  btn.disabled=true;
  try{await put(v.col,rec);const nos=items.filter(i=>i.ans==='no').length;closeModal();
    toast(v.verdict?(rec.verdict==='ok'?'Saved · OK to load':'Saved · Rejected'):`Saved · ${nos?nos+' item'+(nos===1?'':'s')+' marked No':'no defects'}`)}
  catch(e){fail('Not saved: '+(e&&e.message||e))}
}
/* The saved checklist drawn like the printed form it came from, so the screen, the print-out and the PDF all match the hard copy. */
/* The company letterhead exactly as supplied (images/hse-letterhead.png is the full A4 sheet; only its header band is shown). */
const LETTERHEAD='<div class="p-head"><img src="images/hse-letterhead.png" alt="3 RAG company LTD"></div>';

  const logo=LETTERHEAD;
  if(kind==='safeToLoad'){
    const ok=r.verdict?r.verdict==='ok':vehScore(r).no===0,box=on=>`<span class="p-box-t">${on?'✓':''}</span>`;
    return `<div class="paper" id="paper">${logo}<div class="p-title">SAFE TO LOAD INSPECTION CHECKLIST</div>
      <div class="p-line"><b>DATE:</b> ${fill(fmtD(r.date),220)}</div><div class="p-line"><b>TRUCK NO.</b> ${fill(r.plate,220)}</div>
      <div class="p-line"><b>TRAILER NO.</b> ${fill(r.trailer,220)}</div><div class="p-line"><b>DRIVER NAME</b> ${fill(r.driver,280)}</div>
      <table class="p-tbl"><thead><tr><th style="width:44px">ITEM</th><th>DESCRIPTION</th><th style="width:40px">YES</th><th style="width:40px">NO</th><th style="width:26%">INSPECTION REMARKS</th></tr></thead><tbody>
      ${secs.map(g=>{const m=/^([A-Z])\.\s*(.*)$/.exec(g.sec)||['','',g.sec];
        return `<tr class="p-sec"><td>${e(m[1])}${m[1]?'.':''}</td><td colspan="4">${e(m[2]).toUpperCase()}</td></tr>`+g.items.map(i=>{const a=ansOf(i);return `<tr><td class="c">${e(i.no)}</td><td>${e(i.label)}</td><td class="c mk">${a==='yes'?'✓':''}</td><td class="c mk">${a==='no'?'✓':''}</td><td>${e(i.remark)}</td></tr>`}).join('')}).join('')}
      </tbody></table>
      <div class="p-tick"><b>TICK ONE</b><span class="${ok?'on':''}">${box(ok)} OK TO LOAD</span><span class="${ok?'':'on'}">${box(!ok)} REJECTED</span></div>
      <div class="p-line"><b>DRIVER NAME</b> ${fill(r.driver,260)} <b>SIGN</b> ${fill('',150)}</div>
      <div class="p-line"><b>ID &amp; DL NO.</b> ${fill(r.driverId,220)}</div>
      <div class="p-line"><b>Truck Inspected by</b> ${fill(r.inspectedBy||r.checkedBy,240)} <b>SIGN</b> ${fill('',150)}</div></div>`;
  }
  const sg=asArr(r.sign),who=role=>sg.find(x=>x.role===role)||{},sl=(lab,role)=>{const x=who(role);return `<div class="p-line"><b>${lab}:</b> ${fill(x.name,150)} <b>Date:</b> ${fill(x.date?fmtD(x.date):'',90)} <b>Signature:</b> ${fill('',100)}</div>`};
  return `<div class="paper" id="paper">${logo}<div class="p-title">Safe trip Vehicle Inspection form</div>
    <div class="p-line"><b>DATE:</b> ${fill(fmtD(r.date),160)}</div>
    <div class="p-line"><b>VEHICLE Reg. #:</b> ${fill(r.plate,100)} <b>MARK/MODEL:</b> ${fill(r.model,110)} <b>KM:</b> ${fill(r.km,70)} <b>Age:</b> ${fill(r.age,50)}</div>
    <div class="p-note">Mark x in applicable box</div>
    ${secs.map((g,gi)=>`${gi?'':`<div class="p-sub">${e(g.sec.replace(/^360° inspection$/i,'360° Inspection'))}</div>`}<table class="p-tbl${gi?' joined':''}"><thead><tr><th style="text-align:left">${gi?e(g.sec):'ITEM'}</th><th style="width:44px">YES</th><th style="width:44px">NO</th><th style="width:30%">${gi?'':'COMMENTS'}</th></tr></thead><tbody>
      ${g.items.map(i=>{const a=ansOf(i);return `<tr><td>${e(i.no)}${i.no?'.&nbsp; ':''}${e(i.label)}</td><td class="c mk">${a==='yes'?'X':''}</td><td class="c mk">${a==='no'?'X':''}</td><td>${e(i.remark)}</td></tr>`}).join('')}</tbody></table>`).join('')}
    <div class="p-sub">Other defects, list below</div><div class="p-defects">${e(r.defects)}</div>
    <div class="p-sub">VEHICLE INSPECTED BY:</div>
    ${sl('Work Shop Manager','Workshop Manager')}${sl('Driver','Driver')}${sl('HSSE','HSSE')}${sl('Operations Manager','Operations Manager')}</div>`;

function loadScript(src){return new Promise((res,rej)=>{const x=document.createElement('script');x.src=src;x.onload=res;x.onerror=()=>rej(new Error('could not load the PDF tool'));document.head.appendChild(x)})}
async function pdfFrom(el,name,asBlob){
  if(!window.html2pdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js');
  await Promise.all([...el.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  const job=html2pdf().set({margin:[5,0,10,0],filename:name,image:{type:'jpeg',quality:.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:'tr'}}).from(el);
  return asBlob?job.outputPdf('blob'):job.save();
}
function vehPdf(asBlob){
  const {kind,id}=FORM.view,v=VEH[kind],r=S[v.col][id];
  return pdfFrom($('paper'),`${v.tab.replace(/\s+/g,'-')}_${String(r.plate||'').replace(/[^A-Za-z0-9]+/g,'')}_${r.date||''}.pdf`,asBlob);
}
/* Accident / incident report on the letterhead, for printing and for the PDF */
function incPaperHtml(x){
  const r=x.rec,v=x.v,e=t=>esc(t||''),dash=t=>t?e(t):'—';
  const rows=[['Driver',v.driver||'No driver','Date of '+v.type,fmtD(r.date)],['Truck plate',v.plate,'Trailer plate',r.trailerPlate],['Location',r.location,'Severity',v.severity],
    ['Injuries (people)',r.injuries!==undefined&&r.injuries!==null&&r.injuries!==''?String(r.injuries):'','Status',v.status+(r.closedAt?' — closed '+fmtD(r.closedAt):'')],['Third party involved',r.thirdParty,'Police report ref.',r.policeReport]];
  const box=(t,txt)=>`<div class="p-h">${t}</div><div class="p-area">${e(txt)}</div>`;

    <div class="p-ref"><span><b>Register No.:</b> ${e(r.id||'Unregistered')}</span><span><b>Recorded by:</b> ${dash(r.createdBy)}</span></div>
    <table class="p-tbl" style="margin-top:0"><tbody>${rows.map(a=>`<tr><td class="k">${a[0]}</td><td>${dash(a[1])}</td><td class="k">${a[2]}</td><td>${dash(a[3])}</td></tr>`).join('')}</tbody></table>
    ${box('Description of the '+v.type,r.description)}${box('Measures taken',r.measuresTaken)}${box('Notes',r.notes)}
    <div class="p-h">Signed</div>
    <table class="p-tbl p-sign joined" style="margin-top:0"><thead><tr><th style="width:24%;text-align:left">Role</th><th>Name</th><th style="width:20%">Date</th><th style="width:24%">Signature</th></tr></thead>
      <tbody><tr><td class="k">Driver</td><td>${e(v.driver)}</td><td></td><td></td></tr><tr><td class="k">HSSE</td><td></td><td></td><td></td></tr><tr><td class="k">Operations Manager</td><td></td><td></td><td></td></tr></tbody></table></div>`;
}

/* our own "are you sure?" box — the browser's confirm() does not open in every window, which left Delete doing nothing */
function ask(msg,yes){return new Promise(res=>{
  $('askMsg').textContent=msg;$('askYes').textContent=yes||'Delete';$('ov2').classList.add('on');
  const done=v=>{$('ov2').classList.remove('on');res(v)};
  $('askYes').onclick=()=>done(true);$('askNo').onclick=()=>done(false);$('askYes').focus();
})}

/* ---------- handlers ---------- */
const H={
  go(p){UI.page=p;render();window.scrollTo(0,0)},
  polFilter(f){UI.polFilter=f;renderMain()},
  trainTab(t){UI.trainTab=t;renderMain();const e=document.querySelector('#trainTabs .pill.on');if(e)e.scrollIntoView({block:'nearest',inline:'center'})},
  form:openForm,view:openView,save:saveForm,close:closeModal,vehForm,vehSave,vehView,
  vehTab(t){UI.vehTab=t;renderMain()},
  dropFile(i){FORM.files.splice(i,1);$('keptFiles').innerHTML=keptFilesHtml()},
  addFiles(id,inp){if(!FORM)return;FORM.pending=FORM.pending||{};const l=FORM.pending[id]=FORM.pending[id]||[];
    for(const f of inp.files){if(l.some(p=>p.file.name===f.name&&p.file.size===f.size))continue;l.push({file:f,url:/^image\//.test(f.type||'')?URL.createObjectURL(f):''})}
    inp.value='';$('pend_'+id).innerHTML=pendHtml(id)},
  dropPending(id,i){const l=pendList(id),p=l.splice(i,1)[0];if(p&&p.url)URL.revokeObjectURL(p.url);$('pend_'+id).innerHTML=pendHtml(id)},
  pickSearch(q){q=q.trim().toLowerCase();document.querySelectorAll('#pickList .pick-row').forEach(r=>{r.style.display=!q||r.dataset.q.includes(q)?'':'none'})},
  pickAll(on){document.querySelectorAll('#pickList .pick-row').forEach(r=>{if(r.style.display!=='none')r.querySelector('input').checked=on});H.pickCount()},
  pickCount(){const n=document.querySelectorAll('#pickList input:checked').length,e=$('pickCount');if(e)e.textContent=`${n} driver${n===1?'':'s'} ticked`},
  vehTruck(){const pk=x=>String(x||'').replace(/\s+/g,'').toUpperCase(),t=FB.trucks.find(x=>pk(x.plate)===pk($('v_plate').value));if(!t)return;
    const d=FB.drivers.find(x=>x.license_plate&&pk(x.license_plate)===pk(t.plate)),set=(k,x)=>{const e=$('v_'+k);if(e)e.value=x||''};
    set('plate',t.plate);set('trailer',t.trailer||(d&&d.custom&&d.custom.Trailer));set('driver',(d&&d.name)||t.driverName);set('model',[t.brand,t.model].filter(Boolean).join(' '));
    set('driverId',d&&d.license);set('driverSign',(d&&d.name)||t.driverName)},
  /* a driver chosen from the list brings the assigned truck and trailer with them; both stay editable */
  vehDriver(){const nm=String($('v_driver').value||'').trim().toLowerCase(),d=FB.drivers.find(x=>String(x.name||'').trim().toLowerCase()===nm);if(!d)return;
    const pk=x=>String(x||'').replace(/\s+/g,'').toUpperCase(),t=FB.trucks.find(x=>d.license_plate&&pk(x.plate)===pk(d.license_plate)),set=(k,x)=>{const e=$('v_'+k);if(e)e.value=x||''};
    set('driver',d.name);set('plate',(t&&t.plate)||d.license_plate);set('trailer',(t&&t.trailer)||(d.custom&&d.custom.Trailer));set('driverId',d.license)},
  /* one list for each of the three fields; typing a driver's name, a truck plate or a trailer finds the row in any of them */
  combo(k){
    const raw=String($('v_'+k).value||'').trim().toLowerCase(),pk=x=>String(x||'').replace(/\s+/g,'').toLowerCase();
    const drvOf=t=>FB.drivers.find(x=>x.license_plate&&pk(x.license_plate)===pk(t.plate)),trkOf=d=>FB.trucks.find(x=>d.license_plate&&pk(x.plate)===pk(d.license_plate));
    let opts;
    if(k==='driver')opts=FB.drivers.map(d=>{const t=trkOf(d);return {v:d.name||'',s:[d.license_plate,(t&&t.trailer)||(d.custom&&d.custom.Trailer)].filter(Boolean).join(' · ')||'no truck'}});
    else if(k==='plate')opts=FB.trucks.map(t=>{const d=drvOf(t);return {v:t.plate||'',s:[(d&&d.name)||t.driverName,t.trailer].filter(Boolean).join(' · ')||'no driver'}});
    else{const seen={};opts=[];FB.trucks.forEach(t=>{const d=drvOf(t),id=String(t.trailer||(d&&d.custom&&d.custom.Trailer)||'').trim();if(id&&!seen[pk(id)]){seen[pk(id)]=1;opts.push({v:id,s:[t.plate,(d&&d.name)||t.driverName].filter(Boolean).join(' · ')})}});
      FB.trailers.forEach(t=>{const id=String(t.id||'').trim();if(id&&!seen[pk(id)]){seen[pk(id)]=1;opts.push({v:id,s:'not on a truck'})}})}
    opts=opts.filter(o=>{if(!o.v)return false;if(!raw)return true;const h=(o.v+' '+o.s).toLowerCase();return h.includes(raw)||pk(h).includes(pk(raw))}).sort((a,b)=>a.v.localeCompare(b.v)).slice(0,60);
    const box=$('cl_'+k);
    box.innerHTML=opts.map(o=>`<button type="button" class="combo-opt" data-v="${esc(o.v)}" onmousedown="event.preventDefault();H.comboPick('${k}',this.dataset.v)"><span>${esc(o.v)}</span><small>${esc(o.s)}</small></button>`).join('')||'<div class="combo-none">No match. You can still type it in.</div>';
    box.classList.add('on');
  },
  vehTrailer(){const pk=x=>String(x||'').replace(/\s+/g,'').toUpperCase(),v=pk($('v_trailer').value);if(!v)return;
    const t=FB.trucks.find(x=>pk(x.trailer)===v);if(t&&$('v_plate')&&!$('v_plate').value.trim()){$('v_plate').value=t.plate;H.vehTruck()}},
  comboPick(k,v){$('v_'+k).value=v;$('cl_'+k).classList.remove('on');H.comboTyped(k)},
  comboClose(k){$('cl_'+k).classList.remove('on')},
  comboTyped(k){k==='driver'?H.vehDriver():k==='plate'?H.vehTruck():H.vehTrailer()},
  vehPrint(){window.print()},
  incPrint(){window.print()},
  async incDownload(){const x=FORM&&FORM.view&&incBySig(FORM.view.inc),el=$('incPaper');if(!x||!el)return;const b=$('dlBtn');if(b)b.disabled=true;toast('Preparing the PDF…');
    try{await pdfFrom(el,`${x.v.type==='incident'?'Incident':'Accident'}_${String(x.rec.id||x.rec.date||'report').replace(/[^A-Za-z0-9-]+/g,'')}.pdf`);toast('PDF downloaded')}catch(e){toast('PDF not made ('+(e&&e.message||e)+'). Use Print and choose "Save as PDF".')}
    if(b)b.disabled=false},
  async vehDownload(){const b=$('dlBtn');b.disabled=true;toast('Preparing the PDF…');
    try{await vehPdf();toast('PDF downloaded')}catch(e){toast('PDF not made ('+(e&&e.message||e)+'). Use Print and choose "Save as PDF".')}b.disabled=false},
  vehAll(){document.querySelectorAll('#modal .q input[value=yes]').forEach(i=>{i.checked=true});document.querySelectorAll('.q.miss').forEach(q=>q.classList.remove('miss'))},
  addType(){

    $('t_name').focus();

  async incStatus(st){

};
/* A click on the dark area outside a window closes it — the one on top first (the "are you sure?" box, then the window
   under it). The press and the release must both be outside, so dragging to select text inside never closes anything. */
let ovDown=null;
['ov','ov2'].forEach(id=>{const o=$(id);
  o.addEventListener('mousedown',e=>{ovDown=e.target});
  o.addEventListener('click',e=>{if(e.target!==o||ovDown!==o)return;if(id==='ov2')$('askNo').click();else closeModal()})});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('ov2').classList.contains('on'))$('askNo').click();else if($('ov').classList.contains('on'))closeModal()});
